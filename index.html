<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIP Wine Club · Winter 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E9;--surface:#FFFDF9;--ink:#2A1419;--muted:#76655F;--line:#E6DBCD;--tint:#EFE6D9;
  --claret:#6E1A2B;--gold:#96753A;--plat:#5E6670;--save:#6E1A2B;--band:#2A1419;--bandInk:#F3EADB;
  --serif:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif;
  --sans:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A0D11;--surface:#241318;--ink:#F1E8DA;--muted:#B3A294;--line:#3A232A;--tint:#2E181E;
  --claret:#D9929E;--gold:#D2B274;--plat:#BFC6CE;--save:#D2B274;--band:#0F0709;--bandInk:#E9D9BD;}}
:root[data-theme="dark"]{
  --bg:#1A0D11;--surface:#241318;--ink:#F1E8DA;--muted:#B3A294;--line:#3A232A;--tint:#2E181E;
  --claret:#D9929E;--gold:#D2B274;--plat:#BFC6CE;--save:#D2B274;--band:#0F0709;--bandInk:#E9D9BD;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}

/* hero band */
.band{background:var(--band);color:var(--bandInk)}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0;gap:12px}
.brand{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.06em;white-space:nowrap}
.brand span{opacity:.65;font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:.02em;margin-left:10px}
.tools{display:flex;gap:4px}
.tbtn{background:transparent;border:1px solid color-mix(in srgb,var(--bandInk) 30%,transparent);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--bandInk);opacity:.75}
.tbtn[aria-pressed="true"]{background:var(--bandInk);color:var(--band);opacity:1}
.hero{padding:40px 0 30px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(36px,6vw,64px);line-height:1.02;margin:0 0 12px;max-width:18ch;text-wrap:balance}
.hero h1 em{font-style:italic;color:#D2B274}
.hero p{margin:0;opacity:.72;max-width:56ch}
.rule{height:1px;background:linear-gradient(90deg,transparent,#D2B274 20%,#D2B274 80%,transparent);opacity:.55}
.search{position:relative;margin:26px 0 0}
.search input{width:100%;background:color-mix(in srgb,var(--bandInk) 8%,transparent);border:1px solid color-mix(in srgb,var(--bandInk) 25%,transparent);color:var(--bandInk);border-radius:12px;padding:15px 46px;font-size:16px}
.search input::placeholder{color:color-mix(in srgb,var(--bandInk) 55%,transparent)}
.search input:focus{outline:none;border-color:#D2B274}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.6}
.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:color-mix(in srgb,var(--bandInk) 15%,transparent);color:var(--bandInk);border-radius:999px;width:28px;height:28px;cursor:pointer;display:none}
.search.has .clear{display:block}
.views{display:inline-flex;margin-top:18px;border:1px solid color-mix(in srgb,var(--bandInk) 25%,transparent);border-radius:999px;padding:3px}
.views button{border:0;background:transparent;color:var(--bandInk);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;opacity:.7}
.views button[aria-pressed="true"]{background:#D2B274;color:#2A1419;opacity:1}

/* nav */
.nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.nav-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-top:8px}
.nav-in::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;cursor:pointer;padding:8px 14px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-width:92px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab .lbl{font-size:13px;font-weight:600;white-space:nowrap}
.tab .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab .ct.hit{color:var(--claret);font-weight:700}
.tab .big{font-family:var(--serif);font-size:22px;line-height:1;color:var(--ink)}
.tab[aria-selected="true"] .big{color:var(--claret)}
.btl{display:block;height:38px}
.btl .glass{fill:none;stroke:currentColor;stroke-width:1.2}
.btl .wine{fill:var(--claret)}

.shead{padding:30px 0 12px}
.shead h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,40px);margin:0;line-height:1.05}
.shead .unit{color:var(--muted);font-size:14px;margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.6;font-size:11px}
.rchips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:12px}
.rchips .chip{font-family:var(--serif);font-size:14px}
.sel{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.spacer{flex:1}

.cols,.row{display:grid;grid-template-columns:1fr repeat(3,108px);gap:0 8px;align-items:center}
.cols{font-size:12px;color:var(--muted);padding:0 20px 8px;font-weight:600}
.cols div{text-align:right}.cols .g{color:var(--gold)}.cols .p{color:var(--plat)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{padding:16px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.prod{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;letter-spacing:.02em}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.t-red{background:#7A1A2E}.t-white{background:#D9C27A}.t-rose{background:#E3A2AC}.t-sparkling{background:#E8DFB8;box-shadow:inset 0 0 0 1.5px #B9A866}.t-dessert{background:#B9832E}.t-cocktail{background:#D8703F}
.wname{font-family:var(--serif);font-size:20px;font-weight:400;line-height:1.25;margin:2px 0 3px}
.wname .v{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.meta{font-size:13px;color:var(--muted)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink);font-weight:500}
.tag.cat{border-color:var(--gold);color:var(--gold)}
.pr{text-align:right;font-variant-numeric:tabular-nums}
.pr .n{font-size:16px;font-weight:600}
.pr .k{display:none;font-size:11px;color:var(--muted)}
.pr.r .n{color:var(--muted);font-weight:500}
.pr.g .n{color:var(--gold)}
.pr.p .n{font-size:18px;font-weight:700}
.save{display:table;margin:3px 0 0 auto;font-size:11px;font-weight:700;color:var(--save);border:1px solid color-mix(in srgb,var(--save) 35%,transparent);border-radius:999px;padding:0 7px}
mark{background:color-mix(in srgb,var(--gold) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.grp{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);font-style:italic;font-size:17px;padding:11px 20px;background:var(--tint);border-top:1px solid var(--line)}
.grp span{font-family:var(--sans);font-style:normal;font-size:12px;color:var(--muted)}
.list .grp:first-child{border-top:0}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink);font-weight:400;margin-bottom:6px}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.mcard h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:6px 0 12px;line-height:1.2}
.mprices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:12px;font-variant-numeric:tabular-nums}
.mprices small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.mprices b{font-size:16px}.mprices .g b{color:var(--gold)}.mprices .r b{color:var(--muted);font-weight:500}
.mgh{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:18px;margin:22px 0 10px}
.mgh:first-child{margin-top:0}
.mcard .save{margin:10px 0 0}

footer{padding:40px 0 60px;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:10px}
.legend b{color:var(--ink)}

@media (max-width:720px){
  .wrap{padding:0 14px}
  .brand span{display:none}
  .cols{display:none}
  .row{grid-template-columns:repeat(3,1fr);gap:10px 8px}
  .row .info{grid-column:1/-1}
  .pr{text-align:left;background:var(--tint);border-radius:10px;padding:7px 9px}
  .pr .k{display:block}
  .save{margin-left:0}
  .tab{min-width:80px;padding:8px 10px 12px}
}
</style>
</head>

<div class="band">
 <div class="wrap">
  <div class="top">

 </div>

</div>

<main class="wrap">

  <div data-i="foot"></div>
</footer>

}
function priceCell(cls,label,v,extra=""){
  return `<div class="pr ${cls}"><span class="k">${label}</span><span class="n">${v==null?`<span style="font-size:13px;color:var(--muted)">${T().ask}</span>`:money(v)}</span>${extra}</div>`;
}
function row(w,opts={}){
  const t=T(),sv=(w.retail&&w.plat)?Math.round((1-w.plat/w.retail)*100):0;
  const meta=[w.sub,w.cls&&!fold(w.sub+" "+w.title).includes(fold(w.cls))?w.cls:"",w.grape&&fold(w.grape)!==fold(w.title)?w.grape:"",opts.region===false?"":w.region].filter(Boolean);
  const tags=[opts.cat?`<span class="tag cat">${t.cats[w.cat]} · ${t.per[w.case]}</span>`:"",w.size?`<span class="tag">${esc(w.size)}</span>`:""].join("");
  return `<div class="row"><div class="info">
    <div class="prod"><span class="dot t-${w.type}" title="${t.types[w.type]}"></span>${hl(w.producer)}${tags}</div>
    <div class="wname">${hl(w.title)}${w.vintage?`<span class="v">${hl(w.vintage)}</span>`:""}</div>
    <div class="meta">${meta.map(hl).join(" · ")}</div></div>
    ${priceCell("r",t.retail,w.retail)}${priceCell("g","Gold",w.gold)}
    ${priceCell("p","Platinum",w.plat,sv>0?`<span class="save">${t.save(sv)}</span>`:"")}</div>`;
}
const head=()=>`<div class="cols"><span></span><div>${T().retail}</div><div class="g">Gold</div><div class="p">Platinum</div></div>`;

function renderNav(){
  const t=T();let html="";
  if(view==="cat"){
    html=CATS.map(c=>{
      const n=c==="mixed"?DATA.mixed.length:DATA.wines.filter(w=>w.cat===c).length;
      const hits=q&&c!=="mixed"?DATA.wines.filter(w=>w.cat===c&&textMatch(w)).length:null;
      const ct=q?(c==="mixed"?`<span class="ct">&nbsp;</span>`:`<span class="ct ${hits?"hit":""}">${hits}</span>`):`<span class="ct">${n}</span>`;
      return `<button class="tab" role="tab" aria-selected="${!q&&cat===c}" data-k="${c}">${bottle(LEVEL[c],c==="mixed")}<span class="lbl">${t.cats[c]}</span>${ct}</button>`;
    }).join("");
  }else{
    html=COUNTRIES.map(c=>{
      const n=DATA.wines.filter(w=>w.country===c&&(!q||textMatch(w))).length;
      const rs=new Set(DATA.wines.filter(w=>w.country===c).map(w=>w.rg)).size;
      return `<button class="tab" role="tab" aria-selected="${!q&&ctry===c}" data-k="${c}"><span class="big">${n}</span><span class="lbl">${t.countries[c]}</span><span class="ct ${q&&n?"hit":""}">${rs>1?rs+" "+(lang==="es"?"regiones":"regions"):"&nbsp;"}</span></button>`;
    }).join("");
  }
  $("#nav").innerHTML=html;
  $("#nav").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    if(view==="cat")cat=b.dataset.k;else{ctry=b.dataset.k;rgn="all"}
    q="";$("#q").value="";$("#sbox").classList.remove("has");render();
    b.scrollIntoView({inline:"nearest",block:"nearest"});
  });
}
function renderFilters(pool){
  const t=T();const f=$("#filters");
  if(!q&&view==="cat"&&cat==="mixed"){f.innerHTML="";return}
  const base=pool.filter(textMatch);
  const types=["all",...TORDER.filter(x=>base.some(w=>w.type===x))];
  if(!types.includes(type))type="all";
  const showCat=view==="reg"||q;
  const cats=WCATS.filter(c=>base.some(w=>w.cat===c));
  if(fcat!=="all"&&!cats.includes(fcat))fcat="all";
  f.innerHTML=types.map(x=>`<button class="chip" aria-pressed="${type===x}" data-t="${x}">${x!=="all"?`<i class="t-${x}"></i>`:""}${t.types[x]}</button>`).join("")+
   `<span class="spacer"></span>`+
   (showCat?`<select class="sel" id="fcat" aria-label="Category"><option value="all">${t.allC}</option>${cats.map(c=>`<option value="${c}" ${fcat===c?"selected":""}>${t.cats[c]}</option>`).join("")}</select>`:"")+
   `<select class="sel" id="sort" aria-label="Sort">${Object.entries(t.sort).map(([k,v])=>`<option value="${k}" ${sort===k?"selected":""}>${v}</option>`).join("")}</select>`;
  f.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{type=b.dataset.t;render()});
  if($("#fcat"))$("#fcat").onchange=e=>{fcat=e.target.value;render()};
  $("#sort").onchange=e=>{sort=e.target.value;render()};
}
function renderRegionChips(){
  const t=T(),box=$("#rchips");
  if(view!=="reg"||q){box.innerHTML="";return}
  const regs=[...new Set(DATA.wines.filter(w=>w.country===ctry).map(w=>w.rg))].sort(rsort);
  if(regs.length<2){box.innerHTML="";return}
  box.innerHTML=[`<button class="chip" aria-pressed="${rgn==="all"}" data-r="all">${t.allR}</button>`,
    ...regs.map(r=>`<button class="chip" aria-pressed="${rgn===r}" data-r="${esc(r)}">${esc(r)} <small>${DATA.wines.filter(w=>w.country===ctry&&w.rg===r).length}</small></button>`)].join("");
  box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{rgn=b.dataset.r;render()});
}

function render(){
  const t=T();
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>{const k=el.dataset.i;if(typeof t[k]==="string")el.textContent=t[k]});
  $("#h1").innerHTML=t.h1;$("#q").placeholder=t.ph;
  $("#lang-en").setAttribute("aria-pressed",lang==="en");$("#lang-es").setAttribute("aria-pressed",lang==="es");
  $("#v-cat").setAttribute("aria-pressed",view==="cat");$("#v-reg").setAttribute("aria-pressed",view==="reg");
  renderNav();renderRegionChips();
  const out=$("#out");

  if(!q&&view==="cat"&&cat==="mixed"){
    renderFilters([]);
    $("#stitle").textContent=t.cats.mixed;$("#sunit").textContent=t.units.mixed;
    out.innerHTML=["red","white","rose","sparkling"].map(g=>{
      const items=DATA.mixed.filter(m=>m.group===g);if(!items.length)return"";
      return `<div class="mgh">${t.types[g]}</div><div class="mgrid">${items.map(m=>{const sv=Math.round((1-m.plat/m.retail)*100);
        return `<div class="mcard"><span class="dot t-${g}" style="display:inline-block"></span><h3>${esc(m.name)}</h3><div class="mprices"><div class="r"><small>${t.retail}</small><b>${money(m.retail)}</b></div><div class="g"><small>Gold</small><b>${money(m.gold)}</b></div><div><small>Platinum</small><b>${money(m.plat)}</b></div></div>${sv>0?`<span class="save">${t.save(sv)}</span>`:""}</div>`}).join("")}</div>`;
    }).join("");return;
  }

  let pool;
  if(q) pool=DATA.wines;
  else if(view==="cat") pool=DATA.wines.filter(w=>w.cat===cat);
  else pool=DATA.wines.filter(w=>w.country===ctry&&(rgn==="all"||w.rg===rgn));
  renderFilters(pool);
  const list=pool.filter(matches);

  if(q){$("#stitle").textContent=`“${q}”`;$("#sunit").textContent=t.results(list.length)}
  else if(view==="cat"){$("#stitle").textContent=t.cats[cat];$("#sunit").textContent=`${t.units[pool[0].case]} · ${t.wines(list.length)}`}
  else{$("#stitle").textContent=rgn==="all"?t.countries[ctry]:`${rgn}`;
       $("#sunit").textContent=(rgn==="all"?"":t.countries[ctry]+" · ")+t.regUnit(list.length,new Set(list.map(w=>w.rg)).size)}

  if(!list.length){out.innerHTML=`<div class="list"><div class="empty"><b>${t.emptyT} “${esc(q||t.types[type])}”</b>${t.emptyD}</div></div>`;return}

  let html="";
  const grpHead=(label,n)=>`<div class="grp">${esc(label)}<span>${t.wines(n)}</span></div>`;
  if(q){
    WCATS.forEach(c=>{const p=list.filter(w=>w.cat===c).sort(sorter);if(!p.length)return;
      html+=grpHead(`${t.cats[c]} · ${t.per[p[0].case]}`,p.length)+p.map(w=>row(w)).join("")});
  }else if(view==="cat"){
    if(sort==="name") html=list.sort(sorter).map(w=>row(w)).join("");
    else TORDER.forEach(ty=>{const p=list.filter(w=>w.type===ty).sort(sorter);if(!p.length)return;
      html+=grpHead(t.types[ty],p.length)+p.map(w=>row(w)).join("")});
  }else{
    const regs=[...new Set(list.map(w=>w.rg))].sort(rsort);
    regs.forEach(r=>{const p=list.filter(w=>w.rg===r).sort((a,b)=>sort==="name"?sorter(a,b):(TORDER.indexOf(a.type)-TORDER.indexOf(b.type))||sorter(a,b));
      html+=(regs.length>1||rgn==="all"?grpHead(r,p.length):"")+p.map(w=>row(w,{cat:true,region:false})).join("")});
  }
  out.innerHTML=head()+`<div class="list">${html}</div>`;
}

let tm;
$("#q").addEventListener("input",e=>{clearTimeout(tm);tm=setTimeout(()=>{q=e.target.value.trim();$("#sbox").classList.toggle("has",!!q);render()},120)});
$("#clear").onclick=()=>{$("#q").value="";q="";$("#sbox").classList.remove("has");render();$("#q").focus()};
$("#lang-en").onclick=()=>{lang="en";render()};
$("#lang-es").onclick=()=>{lang="es";render()};
$("#v-cat").onclick=()=>{view="cat";fcat="all";render()};
$("#v-reg").onclick=()=>{view="reg";fcat="all";render()};
render();
</script>
</body>
</html>
